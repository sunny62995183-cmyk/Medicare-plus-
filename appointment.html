<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment - MediCare Plus</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <div class="logo">
            MediCare <span>Plus</span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="doctors.html">Doctors</a></li>
            <li><a href="appointment.html">Appointment</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>
</header>

<section class="appointment-section">

    <h1>Book an Appointment</h1>

    <p>Fill in the details to schedule your appointment.</p>

    <form id="appointmentForm">

        <label for="name">Patient Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email">

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="Enter 10-digit phone number">

        <label for="doctor">Select Doctor</label>
        <select id="doctor">
            <option value="">-- Select Doctor --</option>
            <option value="Dr. Rahul Sharma">Dr. Rahul Sharma - Cardiologist</option>
            <option value="Dr. Priya Singh">Dr. Priya Singh - Neurologist</option>
            <option value="Dr. Amit Kumar">Dr. Amit Kumar - Dentist</option>
            <option value="Dr. Neha Verma">Dr. Neha Verma - Dermatologist</option>
        </select>

        <label for="date">Appointment Date</label>
        <input type="date" id="date">

        <label for="time">Appointment Time</label>
        <input type="time" id="time">

        <label for="reason">Reason for Visit</label>
        <textarea id="reason" rows="4"
            placeholder="Describe your problem"></textarea>

        <button type="submit">Book Appointment</button>

        <div id="successMessage"></div>
        <div id="errorMessage"></div>

        <div id="latestBooking"></div>

    </form>

</section>

<script src="js/script.js"></script>

</body>
</html>
